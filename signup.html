    <div class="box1">
        <h1>Register</h1>
        <div class="input-box1">
            <input type="text" placeholder="Username" id="name">
            <i class='bx bxs-user'></i>
        </div>
        <div class="input-box1">
            <input type="password" placeholder="Password" id="pass" required>

        </div>
        <div class="input-box1">
            <input type="email" placeholder="Email" id="email" required>

        </div>

            <input type="number" placeholder="Phone Number" required id="phone">
            <i><svg class="Phone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"

            <label><input type="checkbox">Remember Me</label>

        </div>
        <button type="submit" class="btn1" onclick="register()">Register</button>
        <div class="re-link">
